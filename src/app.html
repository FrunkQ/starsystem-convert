<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Convert star systems between Universe Sandbox, SpaceEngine and Star System Explorer. Runs in your browser; nothing is uploaded."
    />
    <!-- THE CHART ROOM SKIN (static/skin/chart-room.css): typefaces, colours, light and Night chart.
         Before the page's own CSS, so every variable has a value on the first paint. -->
    <link rel="preload" href="%sveltekit.assets%/skin/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%sveltekit.assets%/skin/chart-room.css" />
    <!-- A REMEMBERED CHOICE, APPLIED BEFORE THE FIRST PAINT, so a visitor who chose Night chart on
         a light device never sees a flash of paper. Storage can be refused; then the device decides. -->
    <script>
      try {
        var t = localStorage.getItem('sx-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
